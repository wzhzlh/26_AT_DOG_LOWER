# OpenOCD 配置 — J-Link SWD 烧录 STM32H723
# 用法: openocd -f openocd.cfg -c "program build/Debug/Dog_lower.elf verify reset exit"

source [find interface/jlink.cfg]
transport select swd
source [find target/stm32h7x.cfg]

# SWD 速率 (kHz)
adapter speed 1000

# 软件复位（不依赖 SRST 引脚，通过 AIRCR 寄存器复位）
reset_config none
